spring:
  application:
    name: payment-analysis
  datasource:
    url: ${PERMISSION_JDBC_URL:jdbc:sqlite:permissions.db}
    driver-class-name: ${PERMISSION_JDBC_DRIVER:org.sqlite.JDBC}
    username: ${PERMISSION_JDBC_USERNAME:}
    password: ${PERMISSION_JDBC_PASSWORD:}
    hikari:
      maximum-pool-size: ${PERMISSION_DB_POOL_SIZE:2}
  sql:
    init:
      mode: ${PERMISSION_DB_INIT_MODE:always}
      encoding: UTF-8
      schema-locations: classpath:db/permission-schema.sql,classpath:db/artifact-schema.sql
      data-locations: classpath:db/permission-data.sql
  mvc:
    async:
      # Keep the stream alive while a real LLM completes several reasoning rounds.
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST_TIMEOUT:300000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:800ms}
      timeout: ${REDIS_TIMEOUT:1200ms}

artifact:
  file-storage:
    root: ${ARTIFACT_FILE_ROOT:data/artifacts/files}

permission:
  management:
    password: ${PERMISSION_MANAGEMENT_PASSWORD:helloworld}

server:
  port: 8080
  shutdown: graceful

# One JSON object per line. Search a complete operation through its traceId.
# This file contains user and LLM content, so treat it as business-sensitive data.
process-audit:
  enabled: ${PROCESS_AUDIT_ENABLED:true}
  file: ${PROCESS_AUDIT_FILE:logs/process-audit.jsonl}
  max-text-length: ${PROCESS_AUDIT_MAX_TEXT_LENGTH:200000}

chat:
  memory:
    redis-enabled: ${CHAT_MEMORY_REDIS_ENABLED:true}
    key-prefix: ${CHAT_MEMORY_KEY_PREFIX:payment-analysis:chat:}
    ttl-days: ${CHAT_MEMORY_TTL_DAYS:30}
    max-conversations: ${CHAT_MEMORY_MAX_CONVERSATIONS:50}
    max-messages-per-conversation: ${CHAT_MEMORY_MAX_MESSAGES_PER_CONVERSATION:100}
    max-artifacts-per-conversation: ${CHAT_MEMORY_MAX_ARTIFACTS_PER_CONVERSATION:20}

smartbi:
  dataset-id: ${SMARTBI_DATASET_ID:Iff8080810196b306b3067b2a0196b3067b2a0000}
  base-url: ${SMARTBI_BASE_URL:http://172.19.216.143:8080/smartbi}
  username: ${SMARTBI_USERNAME:admin}
  password: ${SMARTBI_PASSWORD:}
  # 外网/本地开发默认完全走应用内 Mock；公司内网连接真实 SmartBI 时显式设为 false。
  mock-enabled: ${SMARTBI_MOCK_ENABLED:true}
  mock-base-url: ${SMARTBI_MOCK_BASE_URL:http://localhost:${server.port}}

# Metadata retrieval is mocked from the current three source workbooks until
# RAGFlow is reachable. Remote mode is enabled with RAGFLOW_ENABLED=true and
# RAGFLOW_MOCK_ENABLED=false; credentials are never committed here.
ragflow:
  enabled: ${RAGFLOW_ENABLED:false}
  mock-enabled: ${RAGFLOW_MOCK_ENABLED:true}
  base-url: ${RAGFLOW_BASE_URL:}
  retrieval-path: ${RAGFLOW_RETRIEVAL_PATH:/api/v1/retrieval}
  api-key: ${RAGFLOW_API_KEY:}
  dataset-ids: ${RAGFLOW_DATASET_IDS:}
  document-ids:
    metrics: ${RAGFLOW_METRICS_DOCUMENT_ID:}
    dimensions: ${RAGFLOW_DIMENSIONS_DOCUMENT_ID:}
    values: ${RAGFLOW_VALUES_DOCUMENT_ID:}
    business-semantics: ${RAGFLOW_BUSINESS_SEMANTICS_DOCUMENT_ID:}
  similarity-threshold: ${RAGFLOW_SIMILARITY_THRESHOLD:0.2}
  vector-similarity-weight: ${RAGFLOW_VECTOR_SIMILARITY_WEIGHT:0.3}
  rerank-id: ${RAGFLOW_RERANK_ID:}
  top-k: ${RAGFLOW_TOP_K:50}
  page: ${RAGFLOW_PAGE:1}
  page-size: ${RAGFLOW_PAGE_SIZE:5}
  mock-files:
    metrics: ${RAGFLOW_MOCK_METRICS_FILE:C:/Users/hjjgg/Desktop/agent/ragflow/ragflow修改后/度量表.xlsx}
    dimensions: ${RAGFLOW_MOCK_DIMENSIONS_FILE:C:/Users/hjjgg/Desktop/agent/ragflow/ragflow修改后/维度表.xlsx}
    values: ${RAGFLOW_MOCK_VALUES_FILE:C:/Users/hjjgg/Desktop/agent/ragflow/ragflow修改后/维度值域.xlsx}

# Fourth-document business terminology rules. Connection, credentials and
# mock/remote switching are shared with the three metadata documents above.
business-semantics:
  enabled: ${BUSINESS_SEMANTICS_ENABLED:true}
  mock-file: ${BUSINESS_SEMANTICS_MOCK_FILE:data/ragflow/business-semantic-rules.draft.jsonl}
  similarity-threshold: ${BUSINESS_SEMANTICS_SIMILARITY_THRESHOLD:0.90}

attribution:
  policy:
    max-initial-dimensions: ${ATTRIBUTION_MAX_INITIAL_DIMENSIONS:3}
    default-max-branches: ${ATTRIBUTION_DEFAULT_MAX_BRANCHES:2}
    hard-max-branches: ${ATTRIBUTION_HARD_MAX_BRANCHES:3}
    reserved-queries: ${ATTRIBUTION_RESERVED_QUERIES:1}
    min-aligned-contribution-rate: ${ATTRIBUTION_MIN_ALIGNED_CONTRIBUTION_RATE:10}
    minimum-distinct-members: ${ATTRIBUTION_MIN_DISTINCT_MEMBERS:2}

llm:
  mock-enabled: ${LLM_MOCK_ENABLED:false}
  base-url: ${LLM_BASE_URL:https://open.bigmodel.cn}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:deepseek-v4-flash}
  chat-path: ${LLM_CHAT_PATH:/api/paas/v4/chat/completions}
  json-mode: ${LLM_JSON_MODE:true}
  thinking-supported: ${LLM_THINKING_SUPPORTED:true}
  thinking-enabled: ${LLM_THINKING_ENABLED:false}
  max-tokens: ${LLM_MAX_TOKENS:512}
  temperature: ${LLM_TEMPERATURE:0.0}
  max-attempts: ${LLM_MAX_ATTEMPTS:2}
  retry-delay-ms: ${LLM_RETRY_DELAY_MS:300}
  profiles:
    - id: deepseek-v4-flash
      display-name: DeepSeek-V4-Flash（公司）
      model: ${DEEPSEEK_V4_FLASH_MODEL:deepseek-v4-flash}
      base-url: ${DEEPSEEK_V4_FLASH_BASE_URL:http://172.19.209.4:32001/v1}
      chat-path: /chat/completions
      json-mode: ${DEEPSEEK_V4_FLASH_JSON_MODE:false}
      thinking-supported: false
      max-tokens: ${DEEPSEEK_V4_FLASH_MAX_TOKENS:${DEEPSEEK_V4_FALSH_MAX_TOKENS:1024}}
      temperature: ${DEEPSEEK_V4_FLASH_TEMPERATURE:0.0}
    - id: glm-5.2
      display-name: GLM-5.2（本机）
      model: ${GLM_52_MODEL:glm-5.2}
      base-url: ${ZHIPU_LLM_BASE_URL:https://open.bigmodel.cn}
      chat-path: /api/paas/v4/chat/completions
      json-mode: true
      thinking-supported: true
      thinking-enabled: false
      max-tokens: ${GLM_52_MAX_TOKENS:1024}
      temperature: ${GLM_52_TEMPERATURE:0.0}
    - id: glm-4.6-fp8
      display-name: GLM-4.6-FP8（公司）
      model: ${GLM_46_MODEL:glm-4.6-fp8}
      base-url: ${GLM_46_BASE_URL:http://172.19.209.6:32002/v1}
      chat-path: /chat/completions
      json-mode: ${GLM_46_JSON_MODE:false}
      thinking-supported: false
      max-tokens: ${GLM_46_MAX_TOKENS:1024}
      temperature: ${GLM_46_TEMPERATURE:0.0}
